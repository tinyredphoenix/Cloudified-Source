name: Publish SideStore source

on:
  push:
    branches: [main]
    paths:
      - 'incoming/*.json'

permissions:
  contents: write

concurrency:
  group: cloudified-source-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Verify IPA releases and update source
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/publish.py
      - name: Commit source and build history
        run: |
          git config user.name 'Cloudified CI'
          git config user.email '210030099+tinyredphoenix@users.noreply.github.com'
          git add source.json builds.json
          if ! git diff --cached --quiet; then
            git commit -m 'source: publish verified builds'
            git push origin HEAD:main
          fi
